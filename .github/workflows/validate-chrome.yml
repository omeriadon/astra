name: Astra - Browser Chrome

on:
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  favicon:
    name: Favicon observer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Favicon observer
        shell: bash
        run: |
          set -euo pipefail
          node checks/favicon-observer-check.mjs

  tint:
    name: Site-derived chrome tint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Site-derived chrome tint
        shell: bash
        run: |
          set -euo pipefail
          node checks/website-chrome-tint-check.mjs

  mini:
    name: Mini Astra shared chrome
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Mini Astra shared chrome
        shell: bash
        run: |
          set -euo pipefail
          node checks/mini-astra-shared-chrome-check.mjs

  noise:
    name: Noise lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Noise lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/noise-lifecycle-check.py
