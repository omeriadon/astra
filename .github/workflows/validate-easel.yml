name: Astra - Easel

on:
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documents:
    name: Easel documents
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27 and Swift 6.4
        run: bash scripts/ci/select-xcode-27.sh
      - name: Easel documents
        shell: bash
        run: |
          set -euo pipefail
          swiftc  -swift-version 6 astra/Models/Tabs/BrowserEasel.swift checks/easel-document-check.swift -o "$RUNNER_TEMP/documents"
          "$RUNNER_TEMP/documents"
