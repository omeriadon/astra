name: Astra - Browser Use MCP

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture:
    name: Browser Use deterministic fixture and tool registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Browser Use deterministic fixture and tool registry
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/browser-use/test_fixture.py

  runtime:
    name: Browser Use protocol and experimental WebKit E2E
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27 / Swift 6.4
        run: bash scripts/ci/select-xcode-27.sh
      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build unsigned Astra Debug
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build -project astra.xcodeproj -scheme astra -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/AstraMCP" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/astra-mcp-build.log"
      - name: Protocol, HTTP, DOM and listener regression checks
        run: zsh scripts/check_browser_use.sh "$RUNNER_TEMP/AstraMCP/Build/Products/Debug"
      - name: Live Astra WebKit E2E (experimental; nonblocking)
        id: live_e2e
        continue-on-error: true
        env:
          ASTRA_BROWSER_USE_REPORT_DIR: ${{ runner.temp }}/astra-mcp-reports
        run: bash scripts/test-browser-use-e2e.sh "$RUNNER_TEMP/AstraMCP/Build/Products/Debug/astra.app"
      - name: Report live integration test outcome
        if: always()
        shell: bash
        env:
          E2E_OUTCOME: ${{ steps.live_e2e.outcome }}
        run: |
          echo "### Live Astra WebKit E2E (informational)" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${E2E_OUTCOME}. This experimental step is nonblocking and is **not** a passing integration-test guarantee." >> "$GITHUB_STEP_SUMMARY"
          if [[ "${E2E_OUTCOME}" != "success" ]]; then
            echo "::warning::Live Astra WebKit E2E did not pass (result: ${E2E_OUTCOME}). Inspect the diagnostics artifact."
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-use-runtime-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/astra-mcp-build.log
            ${{ runner.temp }}/astra-mcp-reports
          if-no-files-found: warn
          retention-days: 7
