name: Astra - Metal Dither

on:
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'astra/UI/Background/Dither/**'
      - 'astra/UI/Background/NewTabShader*.swift'
      - 'astra/UI/Background/NewTabShaderEffects.metal'
      - 'astra/UI/Content/NewTabView.swift'
      - 'checks/dither-*.swift'
      - 'astra/Models/Spaces/BrowserTheme.swift'
      - '.github/workflows/validate-dither.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dither:
    name: Dither motion and Metal compilation
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27 and Swift 6.4
        run: bash scripts/ci/select-xcode-27.sh
      - name: Check cursor motion and legacy preference migration
        run: |
          swiftc -swift-version 6 astra/UI/Background/Dither/DitherConfiguration.swift \
            astra/UI/Background/Dither/AnimationTiming.swift \
            astra/UI/Background/Dither/DitherMotion.swift astra/UI/Background/NewTabShaderSettings.swift \
            checks/dither-motion-check.swift \
            -o "$RUNNER_TEMP/dither-check"
          "$RUNNER_TEMP/dither-check"
      - name: Type-check native renderer and complete settings UI
        run: |
          swiftc -swift-version 6 -default-isolation MainActor -typecheck \
            -plugin-path "$(xcode-select -p)/Platforms/MacOSX.platform/Developer/usr/lib/swift/host/plugins" \
            astra/UI/Background/Dither/*.swift \
            astra/Models/Spaces/BrowserTheme.swift
      - name: Run optimized renderer GPU differential smoke check
        run: |
          swiftc -swift-version 6 \
            astra/UI/Background/Dither/DitherConfiguration.swift \
            astra/UI/Background/Dither/AnimationTiming.swift \
            astra/UI/Background/Dither/DitherMetalRenderer.swift \
            checks/dither-renderer-gpu-check.swift \
            -o "$RUNNER_TEMP/dither-gpu-check"
          "$RUNNER_TEMP/dither-gpu-check"

  new-tab-effects:
    name: New-tab Metal shader compilation
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27 and Swift 6.4
        run: bash scripts/ci/select-xcode-27.sh
      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Compile and link new-tab effects
        run: |
          xcrun -sdk macosx metal -c astra/UI/Background/NewTabShaderEffects.metal -o "$RUNNER_TEMP/new-tab.air"
          xcrun -sdk macosx metallib "$RUNNER_TEMP/new-tab.air" -o "$RUNNER_TEMP/new-tab.metallib"
