name: Astra - WebKit

on:
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boosts:
    name: Boosts page integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Boosts page integration
        shell: bash
        run: |
          set -euo pipefail
          node checks/boosts-runtime-check.mjs

  reader:
    name: Reader availability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reader availability
        shell: bash
        run: |
          set -euo pipefail
          node checks/reader-availability-check.mjs

  uploads:
    name: WebKit file uploads
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: WebKit file uploads
        shell: bash
        run: |
          set -euo pipefail
          node checks/webkit-file-upload-check.mjs

  policy:
    name: WebKit resource policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: WebKit resource policy
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/webkit-resource-policy-check.py

  benchmark:
    name: WebKit benchmark self-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: WebKit benchmark self-test
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/webkit_benchmark.py self-test
