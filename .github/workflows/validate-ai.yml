name: Astra - AI Tools

on:
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    name: AI browser action safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: AI browser action safety
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/ai-browser-tools-check.py
          node checks/website-augment-check.mjs
          node checks/page-extraction-budget-check.mjs

  markdown-cache:
    name: Markdown attachment cache lifetime
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27 and Swift 6.4
        run: bash scripts/ci/select-xcode-27.sh
      - name: Test attachment cleanup and inline rendering
        run: swift test --package-path Packages/MarkdownView --filter 'MainActorLRUCacheTests|InlineCodeTests|MarkdownRebuildEqualityTests'

  performance-workers:
    name: Performance worker regressions
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27 and Swift 6.4
        run: bash scripts/ci/select-xcode-27.sh
      - name: Exercise production transport, search, archive, encryption and attachment workers
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 6 -default-isolation MainActor -strict-concurrency=complete -strict-memory-safety \
            astra/App/BrowserLog.swift \
            astra/Models/Tabs/BrowserVisit.swift \
            astra/Models/Search/BrowserSearchConfiguration.swift \
            astra/Models/Search/BrowserSearchMatching.swift \
            astra/Models/Search/BrowserHistorySearch.swift \
            astra/Models/Search/BrowserLibrarySearch.swift \
            astra/AI/BrowserAICommandInput.swift \
            astra/AI/BrowserAIAttachment.swift \
            astra/AI/BrowserAIChatHistory.swift \
            astra/Storage/BrowserRestorationStore.swift \
            checks/performance-worker-check.swift -o "$RUNNER_TEMP/performance-workers"
          "$RUNNER_TEMP/performance-workers"

      - name: Typecheck attachment and storage workers against the UIKit SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          ARCH="$(uname -m)"
          python3 - "$RUNNER_TEMP/performance-worker-stubs.swift" <<'PYTHON'
          import pathlib, sys
          source = pathlib.Path("checks/performance-worker-check.swift").read_text()
          pathlib.Path(sys.argv[1]).write_text(source.split("@main struct PerformanceWorkerCheck", 1)[0])
          PYTHON
          xcrun swiftc -typecheck -swift-version 6 -default-isolation MainActor -strict-memory-safety \
            -sdk "$SDK" -target "$ARCH-apple-ios18.0-simulator" \
            astra/App/BrowserLog.swift \
            astra/Models/Tabs/BrowserVisit.swift \
            astra/Models/Search/BrowserSearchConfiguration.swift \
            astra/Models/Search/BrowserSearchMatching.swift \
            astra/Models/Search/BrowserHistorySearch.swift \
            astra/Models/Search/BrowserLibrarySearch.swift \
            astra/AI/BrowserAIAttachment.swift \
            astra/AI/BrowserAIChatHistory.swift \
            astra/Storage/BrowserRestorationStore.swift \
            "$RUNNER_TEMP/performance-worker-stubs.swift"
