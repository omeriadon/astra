name: Astra - Persistence and Restoration

on:
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  window-sync:
    name: Window sync no-op
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Window sync no-op
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/window-sync-noop-check.py
          python3 checks/spotlight-new-tab-migration-check.py

  history-cache:
    name: History derived cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: History derived cache
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/history-derived-cache-check.py

  privacy-cache:
    name: Checkpoint privacy cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkpoint privacy cache
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/checkpoint-privacy-cache-check.py

  library-observation:
    name: Library observation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Library observation
        shell: bash
