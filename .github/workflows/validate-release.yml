name: Astra - Release Metadata

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Release metadata and validation rules
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout full history for release tag validation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release branch and tag
        if: startsWith(github.head_ref || github.ref_name, 'release/')
        env:
          RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_BRANCH" =~ ^release/([0-9]+\.[0-9]+(\.[0-9]+)?)\+([0-9]+)$ ]]; then
            echo "::error::Invalid release branch name: $RELEASE_BRANCH"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          BUILD="${BASH_REMATCH[3]}"
          TAG="v$VERSION+$BUILD"
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::Release tag $TAG already exists"
            exit 1
          fi
          echo "Validated release $VERSION (build $BUILD)"
      - name: Release packaging rule self-tests
        run: |
          set -euo pipefail
          python3 scripts/release/validate_artifact.py --self-test
          python3 checks/website-app-bundle-check.py --self-test
          python3 checks/workflow-diagnostics-check.py
      - name: Startup and Sparkle audit script syntax
        run: |
          bash -n scripts/benchmark_startup.sh
          bash -n scripts/audit_sparkle_bundle.sh
          bash -n scripts/ci/select-xcode-27.sh
