name: Roadmap Mac Build

on:
  push:
    branches:
      - astra/roadmap/integration
    paths:
      - 'astra/**'
      - 'astra.xcodeproj/**'
      - 'Packages/**'
      - '*.xcconfig'

permissions:
  contents: read

concurrency:
  group: roadmap-mac-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-build:
    name: macOS Debug Build
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4

      - name: Select Xcode 27
        shell: bash
        run: |
          set -euo pipefail

          candidates=(
            /Applications/Xcode_27.2_beta.app/Contents/Developer
            /Applications/Xcode_27.2.app/Contents/Developer
            /Applications/Xcode_27.1.app/Contents/Developer
            /Applications/Xcode_27.0.app/Contents/Developer
          )

          selected=""
          for developer_dir in "${candidates[@]}"; do
            if [[ -d "$developer_dir" ]]; then
              selected="$developer_dir"
              break
            fi
          done

          if [[ -z "$selected" ]]; then
            current="$(xcode-select -p)"
            if xcodebuild -version | head -n1 | grep -Eq '^Xcode 27([. ]|$)'; then
              selected="$current"
            else
              echo "::error::No Xcode 27 installation is available on this runner"
              ls -1 /Applications | grep '^Xcode' || true
              exit 1
            fi
          fi

          sudo xcode-select -s "$selected"
          xcodebuild -version

      - name: Install Metal Toolchain
        shell: bash
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build Astra for macOS
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project astra.xcodeproj \
            -scheme astra \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AstraDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/astra-mac-build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-mac-build-log-${{ github.run_number }}
          path: ${{ runner.temp }}/astra-mac-build.log
          if-no-files-found: error
          retention-days: 7
