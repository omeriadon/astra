name: Astra - Native Automation

on:
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    name: Native automation target boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Native automation target boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/native-automation-check.py

  core:
    name: Automation core Swift package
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27 and Swift 6.4
        run: bash scripts/ci/select-xcode-27.sh
      - name: Automation core Swift package
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/AstraAutomationCore
