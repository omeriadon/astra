name: Validate Release

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch, version, and build
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${{ github.head_ref }}"

          if [[ ! "$BRANCH" =~ ^release/([0-9]+\.[0-9]+(\.[0-9]+)?)\+([0-9]+)$ ]]; then
            echo "::error::Release branches must be named release/<version>+<build>, for example release/0.1.1+2"
            exit 1
          fi

          EXPECTED_VERSION="${BASH_REMATCH[1]}"
          EXPECTED_BUILD="${BASH_REMATCH[3]}"

          PROJECT_FILE="astra.xcodeproj/project.pbxproj"

          mapfile -t VERSIONS < <(
            sed -n 's/.*MARKETING_VERSION = \([^;]*\);/\1/p' "$PROJECT_FILE" |
            xargs -n1 |
            sort -u
          )

          mapfile -t BUILDS < <(
            sed -n 's/.*CURRENT_PROJECT_VERSION = \([^;]*\);/\1/p' "$PROJECT_FILE" |
            xargs -n1 |
            sort -u
          )

          if [[ ${#VERSIONS[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one MARKETING_VERSION in the Xcode project, found: ${VERSIONS[*]}"
            exit 1
          fi

          if [[ ${#BUILDS[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one CURRENT_PROJECT_VERSION in the Xcode project, found: ${BUILDS[*]}"
            exit 1
          fi

          ACTUAL_VERSION="${VERSIONS[0]}"
          ACTUAL_BUILD="${BUILDS[0]}"

          echo "Branch:  $BRANCH"
          echo "Expected: version $EXPECTED_VERSION, build $EXPECTED_BUILD"
          echo "Project:  version $ACTUAL_VERSION, build $ACTUAL_BUILD"

          if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::MARKETING_VERSION is $ACTUAL_VERSION but the branch requires $EXPECTED_VERSION"
            exit 1
          fi

          if [[ "$ACTUAL_BUILD" != "$EXPECTED_BUILD" ]]; then
            echo "::error::CURRENT_PROJECT_VERSION is $ACTUAL_BUILD but the branch requires $EXPECTED_BUILD"
            exit 1
          fi

          TAG="v$EXPECTED_VERSION+$EXPECTED_BUILD"

          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::Release tag $TAG already exists"
            exit 1
          fi

          echo "Release metadata is valid."
