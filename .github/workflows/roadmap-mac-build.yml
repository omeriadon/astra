name: Astra - macOS Debug Build

on:
  pull_request:
    branches: [main, 'release/0.1+3']
  push:
    branches: [astra/roadmap/integration, fix/download-network-recovery, feat/split-view-easel-workflow]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-build:
    name: macOS Debug Build
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate startup tooling
        shell: bash
        run: |
          bash -n scripts/benchmark_startup.sh
          bash -n scripts/audit_sparkle_bundle.sh

      - name: Validate Mini Astra shared chrome
        run: node checks/mini-astra-shared-chrome-check.mjs

      - name: Select Xcode 27
        run: bash scripts/ci/select-xcode-27.sh

      - name: SwiftUI Observation regression checks
        run: |
          python3 checks/swiftui-observation-performance-check.py
          python3 checks/control-tab-observation-check.py

      - name: Verify Swift 6.4 compiler and strict safety settings
        run: python3 checks/compiler-safety-settings-check.py

      - name: Verify proxy navigation classification
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 6 astra/Web/Navigation/BrowserNavigationFailure.swift checks/proxy-navigation-failure-check.swift -o "$RUNNER_TEMP/astra-proxy-navigation-check"
          "$RUNNER_TEMP/astra-proxy-navigation-check"

      - name: Verify Easel quote persistence
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 6 astra/Models/Tabs/BrowserEasel.swift checks/easel-document-check.swift -o "$RUNNER_TEMP/astra-easel-document-check"
          "$RUNNER_TEMP/astra-easel-document-check"

      - name: Validate native automation target boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/native-automation-check.py

      - name: Test standalone automation core
        shell: bash
        run: swift test --package-path Packages/AstraAutomationCore

      - name: Install Metal Toolchain
        shell: bash
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build Astra for macOS
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project astra.xcodeproj \
            -scheme astra \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AstraDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/astra-mac-build.log"

      - name: Audit Sparkle linking and embedding
        shell: bash
        run: bash scripts/audit_sparkle_bundle.sh "$RUNNER_TEMP/AstraDerivedData/Build/Products/Debug/astra.app" --unsigned

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-mac-build-log-${{ github.run_number }}
          path: ${{ runner.temp }}/astra-mac-build.log
          if-no-files-found: error
          retention-days: 7
