name: Astra - SwiftUI Observation

on:
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  state:
    name: SwiftUI observation performance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: SwiftUI observation performance
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/swiftui-observation-performance-check.py

  tabs:
    name: Tab and control observation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tab and control observation
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/control-tab-observation-check.py
