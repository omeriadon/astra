name: Validate Release

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release branch
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${{ github.head_ref }}"

          if [[ ! "$BRANCH" =~ ^release/([0-9]+\.[0-9]+(\.[0-9]+)?)\+([0-9]+)$ ]]; then
            echo "::error::Release branches must be named release/<version>+<build>, for example release/0.1.1+2"
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}"
          BUILD="${BASH_REMATCH[3]}"
          TAG="v$VERSION+$BUILD"

          echo "Release branch: $BRANCH"
          echo "Version:        $VERSION"
          echo "Build:          $BUILD"
          echo "Tag:            $TAG"

          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::Release tag $TAG already exists"
            exit 1
          fi

          echo "Release metadata is valid. The branch name is the source of truth."
