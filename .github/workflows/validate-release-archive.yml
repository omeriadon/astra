name: Astra - Release Archive

on:
  pull_request:
    branches: [main, 'release/0.1+3']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    name: Unsigned Release archive and bundle checks
    runs-on: xcode-27
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Check out base branch for size comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          path: baseline-source
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Self-test release size reporting
        run: python3 scripts/ci/release_size_report.py --self-test
      - name: Select Xcode 27
        run: bash scripts/ci/select-xcode-27.sh
      - name: Verify Swift 6.4 compiler and strict safety settings
        run: python3 checks/compiler-safety-settings-check.py
      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build archive and verify distribution layout
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/astra-validation.xcarchive"
          BUILD_ARGUMENTS=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          if [[ "$RELEASE_BRANCH" =~ ^release/([0-9]+\.[0-9]+(\.[0-9]+)?)\+([0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            BUILD="${BASH_REMATCH[3]}"
            BUILD_ARGUMENTS+=("MARKETING_VERSION=$VERSION" "CURRENT_PROJECT_VERSION=$BUILD")
          fi
          set -o pipefail
          xcodebuild archive \
            -project astra.xcodeproj \
            -scheme astra \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            "${BUILD_ARGUMENTS[@]}" 2>&1 | tee "$RUNNER_TEMP/astra-archive-build.log"
          APP="$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          [[ -n "$APP" && -d "$APP" ]] || { echo "::error::No application in archive"; exit 1; }
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"
          if [[ -n "${VERSION:-}" && "$ACTUAL_VERSION" != "$VERSION" ]]; then
            echo "::error::Expected version $VERSION, got $ACTUAL_VERSION"
            exit 1
          fi
          if [[ -n "${BUILD:-}" && "$ACTUAL_BUILD" != "$BUILD" ]]; then
            echo "::error::Expected build $BUILD, got $ACTUAL_BUILD"
            exit 1
          fi
          python3 checks/website-app-bundle-check.py "$APP"
          python3 checks/website-app-runtime-size-check.py "$APP"
          python3 checks/optional-assets-check.py "$APP"
          bash scripts/audit_sparkle_bundle.sh "$APP" --unsigned
          echo "Validated unsigned Astra $ACTUAL_VERSION (build $ACTUAL_BUILD)"
      - name: Build base Release archive (size comparison only)
        if: github.event_name == 'pull_request'
        id: baseline_size
        continue-on-error: true
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          BUILD_ARGUMENTS=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          if [[ "$RELEASE_BRANCH" =~ ^release/([0-9]+\.[0-9]+(\.[0-9]+)?)\+([0-9]+)$ ]]; then
            BUILD_ARGUMENTS+=("MARKETING_VERSION=${BASH_REMATCH[1]}" "CURRENT_PROJECT_VERSION=${BASH_REMATCH[3]}")
          fi
          xcodebuild archive \
            -project baseline-source/astra.xcodeproj \
            -scheme astra \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/astra-baseline.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/AstraBaselineDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackagesBaseline" \
            "${BUILD_ARGUMENTS[@]}" 2>&1 | tee "$RUNNER_TEMP/astra-baseline-build.log"

      - name: Summarise Release bundle sizes (informational)
        continue-on-error: true
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_OUTCOME: ${{ steps.baseline_size.outcome }}
        run: |
          set -euo pipefail
          CANDIDATE_APP="$RUNNER_TEMP/astra-validation.xcarchive/Products/Applications/astra.app"
          BASE_APP="$RUNNER_TEMP/astra-baseline.xcarchive/Products/Applications/astra.app"
          ARGS=(--candidate-app "$CANDIDATE_APP" --candidate-ref "$CANDIDATE_SHA"
                --output-dir "size-report")
          if [[ -n "$BASE_SHA" ]]; then
            ARGS+=(--base-ref "$BASE_SHA")
          fi
          if [[ "$BASE_OUTCOME" == "success" && -d "$BASE_APP" ]]; then
            ARGS+=(--base-app "$BASE_APP")
          fi
          python3 scripts/ci/release_size_report.py "${ARGS[@]}"
          cat size-report/size-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-release-size-${{ github.run_id }}
          path: size-report/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload archive build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-release-archive-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/astra-archive-build.log
            ${{ runner.temp }}/astra-baseline-build.log
          if-no-files-found: ignore
          retention-days: 7
