name: Astra - Sidebar

on:
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native sidebar viewport
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27 / Swift 6.4
        run: bash scripts/ci/select-xcode-27.sh
      - name: Compile and exercise production AppKit viewport with 10,000 rows
        run: |
          swiftc -swift-version 6 -default-isolation MainActor -parse-as-library \
            astra/UI/Shell/NativeSidebar/BrowserSidebarLayout.swift \
            astra/UI/Shell/NativeSidebar/BrowserSidebarScrollView.swift \
            astra/UI/Tabs/BrowserWindowFrameReader.swift \
            checks/native-sidebar-check.swift \
            -o "$RUNNER_TEMP/native-sidebar-check"
          "$RUNNER_TEMP/native-sidebar-check"
      - name: Compile and exercise production native split containers
        run: |
          swiftc -swift-version 6 -default-isolation MainActor -parse-as-library \
            astra/UI/Chrome/BrowserChromeMetrics.swift \
            astra/UI/Shell/BrowserSplitView.swift \
            checks/native-split-check.swift \
            -o "$RUNNER_TEMP/native-split-check"
          "$RUNNER_TEMP/native-split-check"
      - name: Typecheck production UIKit split against the simulator SDK
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          ARCH="$(uname -m)"
          xcrun swiftc -typecheck -swift-version 6 -default-isolation MainActor -sdk "$SDK" \
            -target "$ARCH-apple-ios18.0-simulator" \
            astra/UI/Chrome/BrowserChromeMetrics.swift \
            astra/UI/Shell/BrowserSplitView.swift
      - name: Typecheck production UIKit viewport against the simulator SDK
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          ARCH="$(uname -m)"
          # Minimal names used by the shared viewport, without importing the app.
          cat > "$RUNNER_TEMP/sidebar-stubs.swift" <<'SWIFT'
          import Foundation
          enum SidebarTabCollection: Hashable, Sendable {
            case favourite, pinned, normal, folder(UUID), todayGroup(String)
          }
          enum BrowserChromeMetrics { static let shellEdgePadding: CGFloat = 4 }
          SWIFT
          xcrun swiftc -typecheck -swift-version 6 -default-isolation MainActor -sdk "$SDK" \
            -target "$ARCH-apple-ios18.0-simulator" \
            astra/UI/Shell/NativeSidebar/BrowserSidebarLayout.swift \
            astra/UI/Shell/NativeSidebar/BrowserSidebarScrollView.swift \
            "$RUNNER_TEMP/sidebar-stubs.swift"
