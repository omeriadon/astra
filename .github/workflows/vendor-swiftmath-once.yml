name: Vendor SwiftMath pinned package (one-time)
on:
  push:
    branches:
      - chore/vendor-swiftmath-latinmodern-20261014

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Vendor the exact SwiftMath 1.7.3 source and only Latin Modern Math
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/mgriebling/SwiftMath.git Packages/SwiftMath
          git -C Packages/SwiftMath checkout --quiet --detach fa8244ed032f4a1ade4cb0571bf87d2f1a9fd2d7
          test "$(git -C Packages/SwiftMath rev-parse HEAD)" = "fa8244ed032f4a1ade4cb0571bf87d2f1a9fd2d7"
          rm -rf Packages/SwiftMath/.git Packages/SwiftMath/Tests Packages/SwiftMath/img
          find Packages/SwiftMath -maxdepth 1 -type f \
            ! -name Package.swift ! -name LICENSE ! -name README.md -delete
          FONTDIR=Packages/SwiftMath/Sources/SwiftMath/mathFonts.bundle
          test -f "$FONTDIR/latinmodern-math.otf"
          test -f "$FONTDIR/latinmodern-math.plist"
          test "$(git hash-object "$FONTDIR/latinmodern-math.otf")" = "0e4642e916c3e8206c8bf9c490c90eb3b20d9365"
          # Retain the Latin Modern Math font, its required math table, and all
          # bundled font license notices. Delete the 11 unused font pairs.
          find "$FONTDIR" -maxdepth 1 -type f \
            ! -name latinmodern-math.otf ! -name latinmodern-math.plist \
            ! -name LICENSE ! -name OFL.txt ! -name GUST-FONT-LICENSE.txt -delete
          test "$(find "$FONTDIR" -maxdepth 1 -name '*.otf' | wc -l | xargs)" = 1
          test "$(find "$FONTDIR" -maxdepth 1 -name '*.plist' | wc -l | xargs)" = 1
          cat > Packages/SwiftMath/VENDORING.md <<'DOC'
          # SwiftMath — Astra-local source

          - Upstream: https://github.com/mgriebling/SwiftMath
          - Revision: `fa8244ed032f4a1ade4cb0571bf87d2f1a9fd2d7` (1.7.3)
          - Reason: MarkdownView's math renderer uses SwiftMath's default Latin Modern Math.
          - Retained: `latinmodern-math.otf`, `latinmodern-math.plist`, original source and licenses.
          - Removed: other math font assets, tests and upstream documentation unrelated to building the package.

          The resource bundle must keep the original `mathFonts.bundle` path because
          `MTFont.fontBundle` and the SwiftMath font loader resolve it through `Bundle.module`.
          If MarkdownView begins selecting additional fonts in the future, update the
          resource set together with equation-rendering tests.
          DOC
      - name: Link the local package in the Xcode project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          project = Path('astra.xcodeproj/project.xcproj')
          original = project.read_text()
          marker = '    {\n      "kind": "remote",\n      "repository": "https://github.com/Lakr233/MarkdownView",'
          assert original.count(marker) == 1, 'Cannot find the MarkdownView package declaration'
          local = '    { "kind": "local", "path": "Packages/SwiftMath" },\n'
          assert '"path": "Packages/SwiftMath"' not in original
          project.write_text(original.replace(marker, local + marker, 1))
          resolved = Path('astra.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved')
          data = json.loads(resolved.read_text())
          matches = [p for p in data['pins'] if p['identity'] == 'swiftmath']
          assert len(matches) == 1
          assert matches[0]['state']['revision'] == 'fa8244ed032f4a1ade4cb0571bf87d2f1a9fd2d7'
          data['pins'] = [p for p in data['pins'] if p['identity'] != 'swiftmath']
          resolved.write_text(json.dumps(data, ensure_ascii=False, indent=2, separators=(',', ' : ')) + '\n')
          print('Linked Packages/SwiftMath as a local package override and removed stale remote pin')
          PY
      - name: Validate package structure and commit source (remove this temporary workflow)
        shell: bash
        run: |
          set -euo pipefail
          if command -v swift >/dev/null; then
            swift package --package-path Packages/SwiftMath dump-package >/dev/null
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/vendor-swiftmath-once.yml
          git add Packages/SwiftMath astra.xcodeproj/project.xcproj \
            astra.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            .github/workflows/vendor-swiftmath-once.yml
          git diff --cached --stat
          git commit -m "Vendor SwiftMath 1.7.3 with only Latin Modern Math assets"
          git push origin HEAD:chore/vendor-swiftmath-latinmodern-20261014
