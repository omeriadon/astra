name: Astra - Release Metadata

on:
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-tag:
    name: Release branch and tag
    if: startsWith(github.head_ref || github.ref_name, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release branch and unused tag
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_BRANCH" =~ ^release/([0-9]+\.[0-9]+(\.[0-9]+)?)\+([0-9]+)$ ]]; then
            echo "::error::Invalid release branch name: $RELEASE_BRANCH"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          BUILD="${BASH_REMATCH[3]}"
          TAG="v$VERSION+$BUILD"
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::Release tag $TAG already exists"
            exit 1
          fi
          echo "Validated release $VERSION (build $BUILD)"
  artifact:
    name: Release artifact rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Release artifact rules
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/validate_artifact.py --self-test

  size:
    name: Release size report parser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Release size report parser
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/release_size_report.py --self-test
