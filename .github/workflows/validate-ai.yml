name: Astra - AI Tools

on:
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    name: AI browser action safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: AI browser action safety
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/ai-browser-tools-check.py
          node checks/website-augment-check.mjs
