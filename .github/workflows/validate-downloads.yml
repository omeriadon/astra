name: Astra - Downloads

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: ['fix/download-network-recovery']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Download file worker
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27 and Swift 6.4
        run: bash scripts/ci/select-xcode-27.sh
      - name: Download file worker
        shell: bash
        run: |
          set -euo pipefail
          swiftc  -swift-version 6 astra/Models/Library/BrowserDownload.swift astra/Web/Downloads/BrowserDownloadedFile.swift astra/Web/Downloads/BrowserDownloadFileWorker.swift checks/download-file-worker-check.swift -o "$RUNNER_TEMP/worker"
          "$RUNNER_TEMP/worker"
      - name: Concurrent progress throttle and formatting compatibility
        run: python3 checks/unsafe-cleanup-check.py
