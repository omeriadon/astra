name: Validate Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release:
    name: Validate Release
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 27
        shell: bash
        run: |
          set -euo pipefail

          candidates=(
            /Applications/Xcode_27.2_beta.app/Contents/Developer
            /Applications/Xcode_27.2.app/Contents/Developer
            /Applications/Xcode_27.1.app/Contents/Developer
            /Applications/Xcode_27.0.app/Contents/Developer
          )

          selected=""
          for developer_dir in "${candidates[@]}"; do
            if [[ -d "$developer_dir" ]]; then
              selected="$developer_dir"
              break
            fi
          done

          if [[ -z "$selected" ]]; then
            current="$(xcode-select -p)"
            if xcodebuild -version | head -n1 | grep -Eq '^Xcode 27([. ]|$)'; then
              selected="$current"
            else
              echo "::error::No Xcode 27 installation is available on this runner"
              ls -1 /Applications | grep '^Xcode' || true
              exit 1
            fi
          fi

          sudo xcode-select -s "$selected"
          xcodebuild -version

      - name: Install Metal Toolchain
        shell: bash
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Parse and validate release metadata
        if: startsWith(github.head_ref || github.ref_name, 'release/')
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          BRANCH="$RELEASE_BRANCH"

          if [[ ! "$BRANCH" =~ ^release/([0-9]+\.[0-9]+(\.[0-9]+)?)\+([0-9]+)$ ]]; then
            echo "::error::Release branches must be named release/<version>+<build>, for example release/0.1.1+2"
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}"
          BUILD="${BASH_REMATCH[3]}"
          TAG="v$VERSION+$BUILD"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          echo "Release branch: $BRANCH"
          echo "Version:        $VERSION"
          echo "Build:          $BUILD"
          echo "Tag:            $TAG"

          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::Release tag $TAG already exists"
            exit 1
          fi

      - name: Check distribution validation rules
        run: |
          python3 scripts/release/validate_artifact.py --self-test
          python3 checks/website-app-bundle-check.py --self-test

      - name: Check library projections and favicon observer lifecycle
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 6 \
            astra/Models/Library/Bookmark.swift \
            checks/bookmark-projection-check.swift \
            -o "$RUNNER_TEMP/astra-bookmark-projection-check"
          "$RUNNER_TEMP/astra-bookmark-projection-check"
          node checks/favicon-observer-check.mjs
          python3 checks/automatic-hibernation-runtime-check.py
          swiftc -swift-version 6 \
            astra/Models/Core/BrowserWindowRegistry.swift \
            checks/window-ownership-check.swift \
            -o "$RUNNER_TEMP/astra-window-ownership-check"
          "$RUNNER_TEMP/astra-window-ownership-check"
          swiftc -swift-version 6 \
            astra/Models/Tabs/BrowserVisit.swift \
            checks/history-search-cancellation-check.swift \
            -o "$RUNNER_TEMP/astra-history-search-check"
          "$RUNNER_TEMP/astra-history-search-check"

      - name: Check Debug build
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project astra.xcodeproj \
            -scheme astra \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AstraDebugDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Check asynchronous download file publication
        shell: bash
        run: |
          set -euo pipefail
          swiftc \
            astra/Models/Library/BrowserDownload.swift \
            astra/Web/Downloads/BrowserDownloadedFile.swift \
            astra/Web/Downloads/BrowserDownloadFileWorker.swift \
            checks/download-file-worker-check.swift \
            -o "$RUNNER_TEMP/astra-download-file-worker-check"
          "$RUNNER_TEMP/astra-download-file-worker-check"

      - name: Check unsigned release archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/astra-validation.xcarchive"
          PACKAGES="$RUNNER_TEMP/SourcePackages"
          BUILD_ARGUMENTS=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          if [[ -n "${VERSION:-}" ]]; then
            BUILD_ARGUMENTS+=("MARKETING_VERSION=$VERSION" "CURRENT_PROJECT_VERSION=$BUILD")
          fi

          xcodebuild archive \
            -project astra.xcodeproj \
            -scheme astra \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE" \
            -clonedSourcePackagesDirPath "$PACKAGES" \
            "${BUILD_ARGUMENTS[@]}"

          APP="$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"

          if [[ -z "$APP" || ! -d "$APP" ]]; then
            echo "::error::No .app was produced by the archive"
            exit 1
          fi

          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"

          if [[ -n "${VERSION:-}" && "$ACTUAL_VERSION" != "$VERSION" ]]; then
            echo "::error::Built app version is $ACTUAL_VERSION, expected $VERSION"
            exit 1
          fi

          if [[ -n "${BUILD:-}" && "$ACTUAL_BUILD" != "$BUILD" ]]; then
            echo "::error::Built app build is $ACTUAL_BUILD, expected $BUILD"
            exit 1
          fi

          python3 checks/website-app-bundle-check.py "$APP"

          echo "Compiled unsigned Astra $ACTUAL_VERSION (build $ACTUAL_BUILD). Distribution signing and notarization run only for merged release PRs."
