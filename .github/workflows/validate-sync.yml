name: Astra - Sync

on:
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  url:
    name: Sync URL validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sync URL validation
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/sync-url-validation-check.py

  coordinator:
    name: Sync coordinator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sync coordinator
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/sync-coordinator-check.py

  payload:
    name: Large account sync payloads
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27 and Swift 6.4
        run: bash scripts/ci/select-xcode-27.sh
      - name: Large account sync payloads
        shell: bash
        run: |
          set -euo pipefail
          swiftc  -swift-version 6 astra/Storage/BrowserSyncPayloadLimits.swift checks/sync-large-account-check.swift -o "$RUNNER_TEMP/payload"
          "$RUNNER_TEMP/payload"

  scheduler:
    name: Sync schedule
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27 and Swift 6.4
        run: bash scripts/ci/select-xcode-27.sh
      - name: Sync schedule
        shell: bash
        run: |
          set -euo pipefail
          swiftc  -swift-version 6 astra/Storage/BrowserSyncSchedule.swift checks/sync-scheduler-check.swift -o "$RUNNER_TEMP/scheduler"
          "$RUNNER_TEMP/scheduler"

  integration:
    name: Sync and persistence integration
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27 and Swift 6.4
        run: bash scripts/ci/select-xcode-27.sh
      - name: Sync and persistence integration
        shell: bash
        run: |
          set -euo pipefail
          bash checks/run-sync-models.sh

  logs:
    name: Sync unified logging
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27 and Swift 6.4
        run: bash scripts/ci/select-xcode-27.sh
      - name: Sync unified logging
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 6 astra/App/BrowserLog.swift astra/Storage/BrowserSessionStore.swift checks/browser-log-check.swift -o "$RUNNER_TEMP/astra-sync-log"
          log stream --style compact --level info --predicate 'subsystem == "com.omeriadon.astra" AND category == "sync"' > "$RUNNER_TEMP/astra-sync-events.log" 2>&1 &
          sync_log_pid=$!
          trap 'kill "$sync_log_pid" 2>/dev/null || true' EXIT
          sleep 1
          "$RUNNER_TEMP/astra-sync-log"
          python3 - "$RUNNER_TEMP/astra-sync-events.log" <<'PY'
          import pathlib, sys, time
          path = pathlib.Path(sys.argv[1])
          for _ in range(20):
              if 'sync.check' in path.read_text():
                  print('Essential sync event observed through documented log stream predicate')
                  break
              time.sleep(0.25)
          else:
              raise SystemExit('Essential sync event missing from unified log stream')
          PY
          kill "$sync_log_pid" 2>/dev/null || true
          trap - EXIT
