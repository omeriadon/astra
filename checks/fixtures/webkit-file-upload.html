<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astra WebKit file upload smoke test</title>
<style>
  body { font: 16px system-ui; margin: 30px auto; padding: 0 24px; max-width: 720px; }
  label { display: block; margin: 20px 0; }
  input { display: block; margin-top: 8px; }
  #file-drop-zone { padding: 36px; border: 2px dashed #777; border-radius: 14px; }
  #file-drop-zone.over { border-color: #4a63f5; background: #eef; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid #888; padding: 16px; }
</style>
</head>
<body>
<h1>WebKit file upload smoke test</h1>
<p>Run <code>python3 -m http.server 8877</code> from the repository root and open
<code>http://localhost:8877/checks/fixtures/webkit-file-upload.html</code> in Astra.</p>
<label>Single file
  <input id="single" type="file">
</label>
<label>Multiple files
  <input id="multiple" type="file" multiple>
</label>
<label>Folder upload (webkitdirectory)
  <input id="directory" type="file" webkitdirectory multiple>
</label>
<div id="file-drop-zone" role="region" aria-label="Drop files from Finder here">
  Drag one or more files from Finder into this area.
</div>
<h2>Selected or dropped files</h2>
<pre id="result" role="status" aria-live="polite">No files yet</pre>
<script>
  const result = document.getElementById("result");
  function report(origin, files) {
    result.textContent = origin + ": " + [...files].map(file =>
      [file.webkitRelativePath || file.name, file.size + " bytes", file.type || "unknown type"].join(" — ")
    ).join("\n");
  }
  for (const id of ["single", "multiple", "directory"]) {
    document.getElementById(id).addEventListener("change", event =>
      report(id, event.target.files));
  }
  const zone = document.getElementById("file-drop-zone");
  zone.addEventListener("dragenter", event => {
    event.preventDefault();
    zone.classList.add("over");
  });
  zone.addEventListener("dragover", event => {
    event.preventDefault();
    event.dataTransfer.dropEffect = "copy";
  });
  zone.addEventListener("dragleave", () => zone.classList.remove("over"));
  zone.addEventListener("drop", event => {
    event.preventDefault();
    zone.classList.remove("over");
    report("drop", event.dataTransfer.files);
  });
</script>
</body>
</html>
