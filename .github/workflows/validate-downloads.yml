name: Astra - Downloads

on:
  push:
    branches: [fix/download-network-recovery]
  pull_request:
    branches: [main, 'release/0.1+3']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Downloads
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27 / Swift 6.4
        run: bash scripts/ci/select-xcode-27.sh
      - name: Run checks
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/download-recovery-check.py
          swiftc -frontend -swift-version 6 -parse astra/Web/Downloads/SegmentedDownloadEngine.swift astra/Web/Downloads/BrowserDownloadManager.swift
          python3 checks/download-index-persistence-check.py
          python3 checks/download-staging-io-check.py
          swiftc -swift-version 6 astra/Models/Library/BrowserDownload.swift astra/Web/Downloads/BrowserDownloadedFile.swift astra/Web/Downloads/BrowserDownloadFileWorker.swift checks/download-file-worker-check.swift -o "$RUNNER_TEMP/astra-download-file-worker-check"
          "$RUNNER_TEMP/astra-download-file-worker-check"
