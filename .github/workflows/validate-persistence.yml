          set -euo pipefail
          python3 checks/library-observation-check.py

  window-sidecar:
    name: Window record sidecar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Window record sidecar
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/window-record-sidecar-check.py

  scroll-journal:
    name: Scroll journal storage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scroll journal storage
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/scroll-journal-check.py

  startup-hydration:
    name: Startup hydration dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Startup hydration dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/startup-hydration-dependencies-check.py

  sync-separation:
    name: Persistence and sync separation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
